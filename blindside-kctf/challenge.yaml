# challenge.yaml -- kCTF Kubernetes manifest for The Blind Side
# Web challenge, same CRD shape as currency-arbitrage-kctf /
# h2-smuggle-kctf.

apiVersion: kctf.dev/v1
kind: Challenge
metadata:
  name: the-blind-side

spec:
  deployed: true

  powDifficultySeconds: 0

  network:
    public: true
    ports:
      - protocol: "HTTPS"
        targetPort: 1337

  healthcheck:
    enabled: true
    image: gcr.io/YOUR_GCP_PROJECT/blindside-healthcheck:latest

  image: gcr.io/YOUR_GCP_PROJECT/blindside-challenge:latest

  podTemplate:
    template:
      spec:
        containers:
          - name: challenge
            env:
              # Allowlists the healthcheck sidecar's redirector for the
              # FIRST validation hop only -- see challenge/app/frontend/
              # app.py and challenge/Dockerfile for exactly what this
              # does and doesn't bypass, and README.md's "Wiring into
              # kCTF" section for why it's needed at all.
              - name: TRUSTED_TEST_HOSTS
                value: "healthcheck-redirector:9001"
            resources:
              requests:
                cpu: "150m"
                memory: "192Mi"
              limits:
                cpu: "350m"
                memory: "384Mi"

  horizontalPodAutoscalerSpec:
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
