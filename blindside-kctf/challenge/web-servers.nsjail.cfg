# web-servers.nsjail.cfg -- The Blind Side
# Same shape as currency-arbitrage-kctf's / securevault-kctf's web
# nsjail config.

name: "blindside-web"
description: "NSJail config for LinkAudit Pro + its internal flag-service."

# LISTEN mode for web: reuses the jail for HTTP connections
mode: LISTEN

uidmap { inside_id: "1000" }
gidmap { inside_id: "1000" }

rlimit_as_type:    HARD
rlimit_cpu_type:   HARD
rlimit_nofile_type: HARD
rlimit_nproc_type:  HARD

rlimit_as: 536870912       # 512MB -- two small Flask processes
rlimit_nofile: 1024
rlimit_nproc: 64

cwd: "/app"

mount: [
  {
    src: "/chroot"
    dst: "/"
    is_bind: true
  },
  {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
  },
  {
    dst: "/proc"
    fstype: "proc"
    rw: true
  },
  {
    src: "/etc/resolv.conf"
    dst: "/etc/resolv.conf"
    is_bind: true
  }
]

# Network namespace is NOT cloned (no disable_clone_newnet here) --
# required both so the frontend can reach the outside world (to fetch
# whatever URL the player submits) and so flag-service, bound to
# 127.0.0.1:8080 inside the jail, is reachable from the frontend
# process running alongside it in the same jail.
